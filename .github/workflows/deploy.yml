name: Deploy DYPIU Recruitment Portal to College Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy on Server
    runs-on: self-hosted

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20 environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Execute automated deployment script
        run: |
          chmod +x ./deploy.sh
          ./deploy.sh

