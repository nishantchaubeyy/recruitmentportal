name: Deploy DYPIU Recruitment Portal

on:
  push:
    branches:
      - main

concurrency:
  group: recruitment-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Recruitment to Intranet
    runs-on: [self-hosted, recruitment]

    steps:
      - name: Update production repository
        run: |
          cd /opt/dypiu-recruitment/repo
          git fetch origin main
          git reset --hard origin/main

      - name: Deploy application
        run: |
          cd /opt/dypiu-recruitment/repo
          chmod +x deploy-intranet.sh
          ./deploy-intranet.sh

      - name: Verify backend
        run: |
          curl --fail --silent --show-error \
            --retry 15 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:5000/api/health

      - name: Verify public deployment
        run: |
          curl --fail --silent --show-error \
            --retry 15 --retry-delay 2 --retry-connrefused \
            https://intranet.dypiu.ac.in/recruitment/api/health
