<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D Y Patil International University Recruitment Portal</title>
    <!-- Google Fonts Preconnect & Stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;0,800;1,600;1,700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Preload Logo -->
    <link rel="preload" as="image" href="/logo.png">
    <!-- Force every page to open at top and disable automatic scroll restoration -->
    <script>
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      window.addEventListener('load', () => {
        if (location.hash && !document.getElementById(location.hash.replace('#', ''))) {
          history.replaceState(null, '', location.pathname + location.search);
        }
        window.scrollTo(0, 0);
      });
      window.addEventListener('pageshow', e => { if (e.persisted) window.scrollTo(0, 0); });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
